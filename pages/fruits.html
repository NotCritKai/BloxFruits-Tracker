    <h1>Fruits</h1>
    <p>Keep track of the fruits you have collected in BloxFruits.</p>
    <label for="fruit-storages">How many fruit storages do you have?</label>
    <input
      type="number"
      id="fruit-storages"
      name="fruit-storages"
      min="1"
      step="1"
    />
    <p>
      Enter your storage amount, then choose a rarity to set your fruit
      quantities.
    </p>
    <nav id="rarity-nav" class="rarity-nav" aria-label="Fruit rarities"></nav>
    <p id="fruit-limit-warning" role="status"></p>
    <p id="fruit-save-error" role="status"></p>
    <div id="fruit-list"></div>
    <noscript
      >Enable JavaScript to view and save your fruit quantities.</noscript
    >
  </body>
