<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruits | BloxFruits Tracker</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/fruits.css" />
    <script defer src="../scripts/scripts.js"></script>
    <script defer src="../scripts/fruits.js"></script>
  </head>
  <body>
    <h1>Fruits</h1>
    <p>
      Keep track of the fruits you have collected in BloxFruits.
    </p>
    <label for="fruit-storages">How many fruit storages do you have?</label>
    <input type="number" id="fruit-storages" name="fruit-storages" min="1" step="1" />
    <p>Enter your storage amount, then choose a rarity to set your fruit quantities.</p>
    <nav id="rarity-nav" class="rarity-nav" aria-label="Fruit rarities"></nav>
    <p id="fruit-limit-warning" role="status"></p>
    <p id="fruit-save-error" role="status"></p>
    <div id="fruit-list"></div>
    <noscript>Enable JavaScript to view and save your fruit quantities.</noscript>
  </body>
</html>
