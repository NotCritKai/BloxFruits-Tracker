<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruits | BloxFruits Tracker</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/fruits.css" />
    <script defer src="../scripts/scripts.js"></script>
    <script defer src="../scripts/fruits.js"></script>
  </head>
  <body>
    <h1>Fruits</h1>
    <p>
      Keep track of all the fruits you have collected in BloxFruits. Add new fruits as you acquire them and monitor your progress.
    </p>
    <p>First, Enter How Many Fruit Storages You Have:</p>
    <input type="number" id="fruit-storages" name="fruit-storages" min="1" aria-label="Fruit storages" />

    <p>Next, enter the details of each fruit you have:</p>
    <div class="fruit-row">
      <input type="text" id="fruit-name" name="fruit-name" placeholder="Fruit Name" aria-label="Fruit name" />
      <input type="number" id="fruit-quantity" name="fruit-quantity" min="1" placeholder="Quantity" aria-label="Fruit quantity" aria-describedby="fruit-limit-warning" disabled />
    </div>
    <div id="extra-fruits"></div>
    <p id="fruit-limit-warning" role="status"></p>
    <p id="fruit-save-error" role="status"></p>
    <br />
    <button id="add-fruit" type="button" disabled>Add Fruit</button>
    
  </body>
</html>
